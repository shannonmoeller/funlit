<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <!-- prettier-ignore -->
    <meta name="description" content="Function Lit elements with reactive attributes, properties, and state." />
    <!-- prettier-ignore -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <!-- prettier-ignore -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>" />

    <title>funlit</title>

    <script id="importMap" type="importmap">
      {
        "imports": {
          "funlit": "https://esm.sh/funlit",
          "lit-html": "https://esm.sh/lit-html",
          "lit-html/": "https://esm.sh/lit-html/",
          "@lit/reactive-element/": "https://esm.sh/@lit/reactive-element/"
        }
      }
    </script>

    <script type="module">
      import { define, html } from 'funlit';
      import { createRef, ref } from 'lit-html/directives/ref.js';

      function debounce(fn, ms = 300) {
        let id = -1;

        return (...args) => {
          clearTimeout(id);
          id = setTimeout(() => fn(...args), ms);
        };
      }

      function createHighlights(name) {
        if (!CSS.highlights) return;

        const highlight = new Highlight();
        const rangeCache = new WeakMap();

        CSS.highlights.set(name, highlight);

        return {
          set(node, ranges) {
            for (const range of rangeCache.get(node) ?? []) {
              highlight.delete(range);
            }

            for (const range of ranges) {
              highlight.add(range);
            }

            rangeCache.set(node, ranges);
          },
        };
      }

      const importMap = document.getElementById('importMap').textContent;
      const noise = createHighlights('noise');

      define('fun-example', (host) => {
        let internals = host.attachInternals();
        let editor = createRef();
        let preview = createRef();

        internals.role = 'article';

        function highlightEditor() {
          if (!editor.value) return;
          if (!noise) return;

          const textNode = editor.value.firstChild;
          const matches = textNode.textContent.matchAll(/[^a-z0-9 ]+/gi) ?? [];
          const ranges = Array.from(matches).map((match) => {
            const { index } = match;
            const { length } = match[0];
            const range = new Range();

            range.setStart(textNode, index);
            range.setEnd(textNode, index + length);

            return range;
          });

          noise.set(textNode, ranges);
        }

        function updateEditor(content) {
          if (!editor.value) return;

          editor.value.textContent = content;
          highlightEditor();
        }

        function updatePreview(content) {
          if (!preview.value) return;

          preview.value.srcdoc = `<!doctype html>
            <meta charset="utf8" />
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
            <title>funlit example</title>
            <script type="importmap">
              ${importMap}
            ${'</'}script>
            <style>
              @import './examples/styles.css';
              body {
                background: transparent;
                margin: 1rem;
              }
            </style>
            ${content}
          `;
        }

        const debouncedUpdatePreview = debounce(updatePreview);

        function handleInput(event) {
          highlightEditor();
          debouncedUpdatePreview(event.target.textContent);
        }

        host.addEventListener('connect', async () => {
          const url = new URL(host.getAttribute('src'), location.href);

          if (url.origin !== location.origin) throw new Error();

          const request = await fetch(url);
          const data = await request.text();

          await host.updateComplete;

          updateEditor(data);
          updatePreview(data);
        });

        return () => html`
          <pre
            aria-label="editor"
            contenteditable="plaintext-only"
            spellcheck="false"
            @input=${handleInput}
            ${ref(editor)}
          ></pre>
          <iframe
            sandbox="allow-scripts"
            srcdoc=""
            title="preview"
            ${ref(preview)}
          ></iframe>
        `;
      });
    </script>

    <style>
      @import './examples/styles.css';

      body {
        background-attachment: fixed;
        background-image: radial-gradient(
          circle at 100% 0%,
          var(--color-backgroundBlob),
          transparent
        );
      }

      .app {
        display: flex;
        flex-flow: column;
        gap: 2rem;
        padding: 2rem;
      }

      .app-head {
        display: flex;
        flex-flow: row wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }

      .app-nav {
        display: flex;
        flex-flow: row wrap;
        align-items: baseline;
        gap: 1rem;
      }

      .app-body {
        display: flex;
        flex-flow: column;
        gap: 2rem;
      }

      .app-hero {
        max-inline-size: 40ch;
        text-wrap: balance;
      }

      .app-legal {
        padding-block-start: 0.5rem;
        border-block-start: 1px dashed var(--color-border);
        font: var(--font-legal);
        text-wrap: balance;
      }

      fun-example {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        grid-auto-rows: min-content;
        min-block-size: 20rem;
        border-radius: 0.5rem;
        border: 1px solid var(--color-border);
        contain: paint;

        & > pre {
          padding: 1rem;
          block-size: 22rem;
          min-block-size: 22rem;
          overflow: auto;
          resize: vertical;
        }

        & > pre::highlight(noise) {
          color: var(--color-foregroundAccent);
        }

        & > iframe {
          block-size: 100%;
          min-block-size: 9rem;
          inline-size: 100%;
          outline: 1px dashed var(--color-border);
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header class="app-head">
        <h1>🪵 funlit</h1>

        <nav class="app-nav">
          <a href="https://github.com/shannonmoeller/funlit">Github</a>
          <a href="https://npm.im/funlit">npm</a>
        </nav>
      </header>

      <main class="app-body">
        <!-- prettier-ignore -->
        <p class="app-hero">
          Function <a href="https://lit.dev/docs/libraries/standalone-templates/">Lit</a>
          elements with reactive attributes, properties, and state. Light&nbsp;DOM
          by default for all your progressive&#8209;enhancement needs.
        </p>
        <fun-example src="./examples/fun-stepper.html"></fun-example>
        <fun-example src="./examples/fun-timer.html"></fun-example>
        <fun-example src="./examples/fun-shadow.html"></fun-example>
        <fun-example src="./examples/fun-todo.html"></fun-example>
      </main>

      <footer class="app-foot">
        <!-- prettier-ignore -->
        <p class="app-legal">
          Copyright © 2024 <a href="https://shannonmoeller.com">Shannon Moeller</a>.
          Licensed under <a href="https://github.com/shannonmoeller/funlit/blob/main/LICENSE.md">MIT</a>.
        </p>
      </footer>
    </div>
  </body>
</html>
